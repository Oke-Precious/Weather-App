<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./all.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-bg"></div>

  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-dot"></div>
        <h1>Atmos</h1>
      </div>

      <form class="search" onsubmit="event.preventDefault(); weather();">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="userCity" type="text" placeholder="Search city e.g. Lagos" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
    </header>

    <section class="hero card">
      <div>
        <p class="muted">Current location</p>
        <h2 id="cityName">Detecting location...</h2>
        <p id="weatherDesc" class="desc">--</p>
        <div class="temp-row">
          <span id="mainTemp">--</span><sup>°C</sup>
        </div>
      </div>

      <div class="weather-icon-wrap" aria-hidden="true">
        <div class="sun"></div>
        <div class="cloud cloud-a"></div>
        <div class="cloud cloud-b"></div>
      </div>
    </section>

    <section class="stats-grid">
      <article class="stat card">
        <p class="muted">Feels Like</p>
        <h3 id="feelsLike">--</h3>
      </article>
      <article class="stat card">
        <p class="muted">Humidity</p>
        <h3 id="humidity">--</h3>
      </article>
      <article class="stat card">
        <p class="muted">Wind Speed</p>
        <h3 id="wind">--</h3>
      </article>
      <article class="stat card">
        <p class="muted">Pressure</p>
        <h3 id="pressure">--</h3>
      </article>
      <article class="stat card">
        <p class="muted">Country</p>
        <h3 id="country">--</h3>
      </article>
      <article class="stat card">
        <p class="muted">Status</p>
        <h3 id="status">--</h3>
      </article>
    </section>
  </main>

  <script>
    const APIkey = 'dfbe9e2443f7d15039258e895705c58f';

    const cityName = document.getElementById('cityName');
    const weatherDesc = document.getElementById('weatherDesc');
    const mainTemp = document.getElementById('mainTemp');
    const feelsLike = document.getElementById('feelsLike');
    const humidity = document.getElementById('humidity');
    const wind = document.getElementById('wind');
    const pressure = document.getElementById('pressure');
    const country = document.getElementById('country');
    const statusText = document.getElementById('status');

    function kelvinToCelsius(kelvin) {
      return Math.round(kelvin - 273.15);
    }

    function updateUI(data) {
      const temp = kelvinToCelsius(data.main.temp);
      const feels = kelvinToCelsius(data.main.feels_like);
      const description = data.weather?.[0]?.description || 'N/A';

      cityName.textContent = data.name;
      weatherDesc.textContent = description;
      mainTemp.textContent = temp;
      feelsLike.textContent = `${feels}°C`;
      humidity.textContent = `${data.main.humidity}%`;
      wind.textContent = `${data.wind.speed} m/s`;
      pressure.textContent = `${data.main.pressure} hPa`;
      country.textContent = data.sys.country;
      statusText.textContent = data.weather?.[0]?.main || '--';
    }

    async function weather() {
      const query = document.getElementById('userCity').value.trim();
      if (!query) return;

      statusText.textContent = 'Loading...';

      try {
        const endpoint = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(query)}&appid=${APIkey}`;
        const response = await fetch(endpoint);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data?.message || 'Unable to fetch weather');
        }

        updateUI(data);
      } catch (error) {
        statusText.textContent = 'Error';
        cityName.textContent = 'City not found';
        weatherDesc.textContent = error.message;
      }
    }

    function getLocation() {
      if (!navigator.geolocation) {
        statusText.textContent = 'Geolocation unsupported';
        return;
      }

      navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const endpoint = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${APIkey}`;
          const response = await fetch(endpoint);
          const data = await response.json();

          if (!response.ok) throw new Error(data?.message || 'Location fetch failed');

          updateUI(data);
        } catch (error) {
          statusText.textContent = 'Error';
          weatherDesc.textContent = error.message;
        }
      });
    }

    window.addEventListener('load', getLocation);
  </script>
</body>
</html>
